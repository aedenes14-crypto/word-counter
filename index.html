<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #000;
    color: #fff;
    font-size: 13px;
    overflow: hidden;
  }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  .top-stats {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 4px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .stat { text-align: center; flex: 1; }
  .stat .value {
    font-size: 16px;
    font-weight: bold;
    color: inherit;
    line-height: 1.2;
    text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
  }
  .stat .label {
    font-size: 10px;
    opacity: 0.5;
    margin-top: 2px;
    text-shadow: 0 0 6px currentColor;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .toolbar button {
    background: transparent;
    border: none;
    color: inherit;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toolbar button svg {
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 0 6px currentColor);
  }
  .toolbar button svg path,
  .toolbar button svg rect,
  .toolbar button svg line,
  .toolbar button svg polyline {
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .editor {
    flex: 1;
    width: 100%;
    background: transparent;
    color: inherit;
    border: none;
    padding: 15px;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    font-family: 'Segoe UI', Arial, sans-serif;
    text-shadow: 0 0 6px currentColor;
  }
  .editor::placeholder { opacity: 0.3; text-shadow: none; }

  .page-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .page-header h2 {
    font-size: 16px; font-weight: normal;
    color: inherit;
    text-shadow: 0 0 8px currentColor;
  }
  .back-btn {
    background: transparent; border: none;
    color: inherit; font-size: 20px;
    cursor: pointer; padding: 4px 10px;
    text-shadow: 0 0 8px currentColor;
  }

  .page-content {
    flex: 1; overflow-y: auto;
    padding: 15px;
  }

  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 15px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    margin-bottom: 8px;
    color: inherit;
    cursor: pointer;
    font-size: 14px;
    text-shadow: 0 0 6px currentColor;
  }
  .menu-item:active { background: rgba(255,255,255,0.1); }

  .settings-item {
    display: flex; justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 8px;
    color: inherit;
    text-shadow: 0 0 6px currentColor;
  }
  .switch {
    position: relative; width: 44px; height: 24px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px; cursor: pointer;
    transition: 0.3s;
  }
  .switch::after {
    content: ''; position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: currentColor; border-radius: 50%;
    transition: 0.3s;
    box-shadow: 0 0 8px currentColor;
  }
  .switch.on { background: rgba(255,255,255,0.5); }
  .switch.on::after { left: 23px; }

  .theme-item {
    display: flex; align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 8px;
    cursor: pointer;
    color: inherit;
    text-shadow: 0 0 6px currentColor;
  }
  .theme-item:active { background: rgba(255,255,255,0.1); }
  .theme-item.active { border-color: currentColor; box-shadow: 0 0 12px currentColor; }
  .theme-preview {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.15);
  }
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div class="screen active" id="screen-main">
  <div class="top-stats">
    <div class="stat"><div class="value" id="s-chars">0</div><div class="label">Символы</div></div>
    <div class="stat"><div class="value" id="s-words">0</div><div class="label">Слова</div></div>
    <div class="stat"><div class="value" id="s-sentences">0</div><div class="label">Предложения</div></div>
    <div class="stat"><div class="value" id="s-paragraphs">0</div><div class="label">Абзацы</div></div>
    <div class="stat"><div class="value" id="s-unique">0</div><div class="label">Уникальные</div></div>
    <div class="stat"><div class="value" id="s-time">00:00</div><div class="label">Время</div></div>
  </div>

  <div class="toolbar">
    <button onclick="showScreen('menu')">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button onclick="copyText()">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button onclick="clearText()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <textarea class="editor" id="input" placeholder="Вставь текст сюда..." oninput="onInput()"></textarea>
</div>

<!-- ЭКРАН: МЕНЮ -->
<div class="screen" id="screen-menu">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('main')">←</button>
    <h2>Меню</h2>
  </div>
  <div class="page-content">
    <div class="menu-item" onclick="showScreen('settings')">⚙ Настройки</div>
    <div class="menu-item" onclick="showScreen('themes')">🎨 Темы</div>
  </div>
</div>

<!-- ЭКРАН: НАСТРОЙКИ -->
<div class="screen" id="screen-settings">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('menu')">←</button>
    <h2>Настройки</h2>
  </div>
  <div class="page-content">
    <div class="settings-item">
      <span>Уникальные слова</span>
      <div class="switch on" onclick="toggleSetting('unique', this)"></div>
    </div>
    <div class="settings-item">
      <span>Символы</span>
      <div class="switch on" onclick="toggleSetting('chars', this)"></div>
    </div>
    <div class="settings-item">
      <span>Предложения</span>
      <div class="switch on" onclick="toggleSetting('sentences', this)"></div>
    </div>
    <div class="settings-item">
      <span>Абзацы</span>
      <div class="switch on" onclick="toggleSetting('paragraphs', this)"></div>
    </div>
    <div class="settings-item">
      <span>Автокопирование</span>
      <div class="switch" onclick="toggleSetting('autocopy', this)"></div>
    </div>
  </div>
</div>

<!-- ЭКРАН: ТЕМЫ -->
<div class="screen" id="screen-themes">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('menu')">←</button>
    <h2>Темы</h2>
  </div>
  <div class="page-content">
    <div class="theme-item" onclick="setTheme('black', this)">
      <div class="theme-preview" style="background:#000;"></div>
      <span>Чёрная</span>
    </div>
    <div class="theme-item" onclick="setTheme('red', this)">
      <div class="theme-preview" style="background:#8b0000;"></div>
      <span>Красная</span>
    </div>
    <div class="theme-item" onclick="setTheme('white', this)">
      <div class="theme-preview" style="background:#f0f0f0;"></div>
      <span>Белая</span>
    </div>
  </div>
</div>

<script>
const settings = { unique: true, chars: true, sentences: true, paragraphs: true, autocopy: false };
let startTime = null;
let timerInterval = null;

const themes = {
  black: { bg: '#000',    text: '#fff' },
  red:   { bg: '#8b0000', text: '#fff' },
  white: { bg: '#f0f0f0', text: '#000' }
};

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function toggleSetting(key, el) {
  settings[key] = !settings[key];
  el.classList.toggle('on', settings[key]);
  updateStats();
}

function setTheme(name, el) {
  const t = themes[name];
  document.body.style.background = t.bg;
  document.body.style.color = t.text;
  document.querySelectorAll('.theme-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
}

function onInput() {
  const text = document.getElementById('input').value;
  if (text.trim() && !startTime) {
    startTime = Date.now();
    timerInterval = setInterval(updateStats, 1000);
  }
  if (!text.trim() && startTime) {
    clearInterval(timerInterval);
    startTime = null;
    timerInterval = null;
  }
  updateStats();
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function updateStats() {
  const text = document.getElementById('input').value;
  const words = text.toLowerCase().match(/[\wа-яё\-]+/gi) || [];
  const chars = text.replace(/\s/g, '').length;
  const unique = new Set(words).size;
  const sentences = (text.match(/[.!?]+/g) || []).length;
  const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim()).length;

  document.getElementById('s-chars').textContent = settings.chars ? chars : '—';
  document.getElementById('s-words').textContent = words.length;
  document.getElementById('s-sentences').textContent = settings.sentences ? sentences : '—';
  document.getElementById('s-paragraphs').textContent = settings.paragraphs ? paragraphs : '—';
  document.getElementById('s-unique').textContent = settings.unique ? unique : '—';
  document.getElementById('s-time').textContent = startTime ? formatTime(Date.now() - startTime) : '00:00';

  if (settings.autocopy && text.trim()) navigator.clipboard.writeText(text);
}

function copyText() {
  const text = document.getElementById('input').value;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(() => {
    showToast('Скопировано');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Скопировано');
  });
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: inherit;
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 13px;
      text-shadow: 0 0 8px currentColor;
      box-shadow: 0 0 20px currentColor;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.style.opacity = '0';
  }, 1200);
}

function clearText() {
  const text = document.getElementById('input').value;
  if (!text.trim()) return;
  showConfirm('Очистить текст?', () => {
    document.getElementById('input').value = '';
    clearInterval(timerInterval);
    startTime = null;
    timerInterval = null;
    updateStats();
  });
}

function showConfirm(msg, onYes) {
  let overlay = document.getElementById('confirmOverlay');
  if (overlay) overlay.remove();

  overlay = document.createElement('div');
  overlay.id = 'confirmOverlay';
  overlay.style.cssText = `
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  `;

  const box = document.createElement('div');
  box.style.cssText = `
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    color: inherit;
    box-shadow: 0 0 30px currentColor;
    text-shadow: 0 0 8px currentColor;
    min-width: 220px;
  `;

  const text = document.createElement('div');
  text.textContent = msg;
  text.style.cssText = `
    font-size: 14px;
    margin-bottom: 18px;
    text-shadow: 0 0 8px currentColor;
  `;

  const btnRow = document.createElement('div');
  btnRow.style.cssText = `display: flex; gap: 10px; justify-content: center;`;

  const yesBtn = document.createElement('button');
  yesBtn.textContent = 'Да';
  yesBtn.style.cssText = `
    padding: 8px 22px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    color: inherit;
    font-size: 13px;
    cursor: pointer;
    text-shadow: 0 0 6px currentColor;
    box-shadow: 0 0 10px currentColor;
  `;
  yesBtn.onclick = () => { overlay.remove(); onYes(); };

  const noBtn = document.createElement('button');
  noBtn.textContent = 'Нет';
  noBtn.style.cssText = `
    padding: 8px 22px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: inherit;
    font-size: 13px;
    cursor: pointer;
    opacity: 0.6;
  `;
  noBtn.onclick = () => overlay.remove();

  btnRow.appendChild(yesBtn);
  btnRow.appendChild(noBtn);
  box.appendChild(text);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
</script>
</body>
  </html>
